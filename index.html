<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="utf-8">
<title>Photo Transform</title>

<meta name="viewport" content="width=device-width, initial-scale=.7">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://code.jquery.com/mobile/1.3.2/jquery.mobile-1.3.2.min.css" />
<script src="https://code.jquery.com/jquery-1.9.1.min.js"></script>
<script src="https://code.jquery.com/mobile/1.3.2/jquery.mobile-1.3.2.min.js"></script>

<script>

// show last update in console
var docMod = document.lastModified;
console.log("This file last modified " + docMod);

/* DO NOT TOUCH - fixes iPhone image bug */
function detectVerticalSquash(img) {
  var iw = img.naturalWidth, ih = img.naturalHeight;
  var canvas = document.createElement('canvas');
  canvas.width = 1;
  canvas.height = ih;
  var ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0);
  var data = ctx.getImageData(0, 0, 1, ih).data;
  var sy = 0;
  var ey = ih;
  var py = ih;
  while (py > sy) {
    var alpha = data[(py - 1) * 4 + 3];
    if (alpha === 0) { ey = py; } 
    else { sy = py; }
    py = (ey + sy) >> 1;
  }
  var ratio = (py / ih);
  return (ratio===0)?1:ratio;
}

function drawImageIOSFix(ctx, img, sx, sy, sw, sh, dx, dy, dw, dh) {
  var vertSquashRatio = detectVerticalSquash(img);
  ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh / vertSquashRatio);
}

/* wait until page loads */
window.onload = function() {

  var fileInput = document.getElementById('fileInput');
  var messageDisplayArea = document.getElementById('messageDisplayArea');

  fileInput.addEventListener('change', function(e) {

    var file = fileInput.files[0];
    var imageType = /image.*/;

    if (file.type.match(imageType)) {

      var reader = new FileReader();

      reader.onload = function(e) {

        messageDisplayArea.innerHTML = "Image loaded";

        var img = new Image();

        img.onload = function() {

          // draw original image on canvas 1
          drawImageIOSFix(context, img, 0, 0, img.naturalWidth, img.naturalHeight, 0, 0, 600, 500);

          /*  +++++++++++++++ BEGIN IMAGE PROCESSING +++++++++++++++ */

          // get second canvas
          var canvas2 = document.getElementById("canvas2");
          var ctx2 = canvas2.getContext("2d");

          // get image data from first canvas
          var imageData = context.getImageData(0, 0, canvas.width, canvas.height);

          var data = imageData.data;

          // loop through pixels
          for (var i = 0; i < data.length; i += 4) {

            // remove red and green
            data[i] = 0;       // red
            data[i+1] = 0;     // green
            // blue stays the same (data[i+2])
          }

          // put modified image on canvas 2
          ctx2.putImageData(imageData, 0, 0);

          // add label again (so it doesn’t disappear)
          ctx2.fillStyle = "white";
          ctx2.font = "20pt Arial";
          ctx2.fillText("Blue only image", 10, 30);

          /*  ++++++++++++++++++++++++++++++++++++++++++++++++++++++ */

        };

        img.src = reader.result;

      };

      reader.readAsDataURL(file);

    } else {
      messageDisplayArea.innerHTML = "Not an image";
    }

  });

}
</script>
</head>

<body>

<div data-role="page">

<div data-role="header">
<h1>Blue Detector</h1>
</div>

<div data-role="content">	

<h3>Pick an image</h3>

<input type="file" id="fileInput" style="background-color: orange;">

<div id="messageDisplayArea"></div>

<br>

<!-- Canvas 1 -->
<canvas id="myCanvas" width=600 height=500 style="border:1px solid black;"></canvas>

<script>
var canvas = document.getElementById('myCanvas');
var context = canvas.getContext("2d");

context.font = '20pt Arial';
context.fillText("Original image", 10, 30);
</script>

<br><br>

<!-- Canvas 2 -->
<canvas id="canvas2" width=600 height=500 style="border:1px solid black;"></canvas>

<script>
var canvas2 = document.getElementById('canvas2');
var ctx2 = canvas2.getContext("2d");

ctx2.font = '20pt Arial';
ctx2.fillText("Blue only image", 10, 30);
</script>

</div>

<div data-role="footer">
<p>DIY Diagnostics</p>
</div>

</div>

</body>
</html>
